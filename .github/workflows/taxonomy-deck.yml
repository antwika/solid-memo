name: Taxonomy deck update

# Once a week, bring the "Swedish labour market taxonomy: new and changed
# occupation names" deck up to the newest version of Arbetsförmedlingen's
# labour market taxonomy (docs/deck-library.md): when the taxonomy has a
# version the deck's latest release lacks, regenerate the deck, release it,
# run the full check and open a pull request (or update the open one).
# Merging the pull request publishes the release. A failure opens an issue.
# The deck's first release is made by hand; until then this does nothing.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: taxonomy-deck
  cancel-in-progress: false

env:
  DECK: swedish-labour-market-taxonomy-occupation-names
  GENERATOR: packages/deck-library/scripts/generate_deck_of_swedish_labour_market_taxonomy_occupation_names.py
  CREATOR: Anton Wiklund <antonwiklund91@gmail.com>
  BRANCH: deck/taxonomy-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The deck records the Python and Unicode versions it was made with,
      # and card ids are slugs that depend on Unicode: keep the Python its
      # first release was made with.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: check
        run: python3 "$GENERATOR" -o "packages/deck-library/decks/$DECK.ttl" --check >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.update == 'true'
        run: echo "Taxonomy version ${{ steps.check.outputs.newest }} is out; release covers ${{ steps.check.outputs.released }}."

      # A published taxonomy version never changes, so its snapshot is kept.
      - if: steps.check.outputs.update == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/taxonomy
          key: taxonomy-${{ steps.check.outputs.newest }}
          restore-keys: taxonomy-
      - if: steps.check.outputs.update == 'true'
        run: >-
          python3 "$GENERATOR" -o "packages/deck-library/decks/$DECK.ttl" --creator "$CREATOR"
          --cache-dir ~/.cache/taxonomy --notes-file "$RUNNER_TEMP/notes.txt"

      - if: steps.check.outputs.update == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.update == 'true'
        run: npm ci
      - if: steps.check.outputs.update == 'true'
        run: npm run deck:release -- "$DECK" --notes "$(cat "$RUNNER_TEMP/notes.txt")"

      # The full check, as CI runs it: this pull request is opened with the
      # workflow's own token, which starts no other workflow.
      - if: steps.check.outputs.update == 'true'
        run: npm run check
      - if: steps.check.outputs.update == 'true'
        run: npm run build
      - if: steps.check.outputs.update == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - if: steps.check.outputs.update == 'true'
        run: pip install -r scripts/requirements-ci.txt && python scripts/shacl_crosscheck.py

      - if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.check.outputs.newest }}
        run: |
          title="Release the taxonomy deck for taxonomy version $NEWEST"
          body="$(printf '%s\n\n%s\n' "Made by the weekly [taxonomy deck workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), which ran the full check. Merging publishes the release." "$(cat "$RUNNER_TEMP/notes.txt")")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add packages/deck-library
          git commit -m "$title" -m "$(cat "$RUNNER_TEMP/notes.txt")"
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          fi

      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The weekly taxonomy deck update failed"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "It failed again: $run"
          else
            gh issue create --title "$title" --body "See $run. The generator stops when a published taxonomy version has changed or the taxonomy is not as it expects; the release stops when the library would not be valid."
          fi
