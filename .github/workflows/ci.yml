# Build and test every branch. On main, a green run triggers deploy.yml.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch; a newer push supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
