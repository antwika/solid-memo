name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm run format:turtle:check
      - run: npm test
      - run: npm run build
      # The published library and vocabulary, checked again by an
      # independent SHACL engine (pySHACL), SPARQL constraints included.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/shacl_crosscheck.py
