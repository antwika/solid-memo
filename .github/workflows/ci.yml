name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: npm ci
      # Every package: typecheck, tests at 100% coverage, generated code and
      # Turtle formatting in step with their sources; then the boundaries.
      - run: npm run check
      - run: npm run build
      # The published library and vocabulary, checked again by an
      # independent SHACL engine (pySHACL), SPARQL constraints included.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/shacl_crosscheck.py

  # The app's use cases and Solid adapters against real Solid servers,
  # one job per server (e2e/pod/servers.ts): each installs only its server,
  # from its own lockfile, starts it on this runner and runs the whole
  # suite (docs/testing.md). One server failing does not stop the others.
  pod:
    name: pod (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [css-7, css-6, nss-6, nss-5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/pod/servers/${{ matrix.server }}/package-lock.json
      - run: npm ci
      - run: npm run servers -w @solid-memo/e2e-pod -- ${{ matrix.server }}
      - run: npm run test:pod
        env:
          SOLID_SERVERS: ${{ matrix.server }}
